<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | 3D Angels</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fafafa;
      --text-main: #09090b;
      --text-muted: #71717a;
      --accent-color: #0066cc;
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background grid */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    /* Floating 3D shapes */
    .floating-shape {
      position: absolute;
      border-radius: 16px;
      opacity: 0.06;
      animation: float 8s ease-in-out infinite;
    }

    .shape-1 {
      width: 200px;
      height: 200px;
      background: var(--accent-color);
      top: 10%;
      left: 10%;
      animation-delay: 0s;
      transform: rotate(15deg);
    }

    .shape-2 {
      width: 150px;
      height: 150px;
      background: var(--text-main);
      bottom: 15%;
      right: 10%;
      animation-delay: -3s;
      transform: rotate(-20deg);
      border-radius: 50%;
    }

    .shape-3 {
      width: 100px;
      height: 100px;
      background: var(--accent-color);
      top: 60%;
      left: 5%;
      animation-delay: -5s;
      transform: rotate(45deg);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(15deg); }
      50% { transform: translateY(-30px) rotate(25deg); }
    }

    /* Content */
    .error-container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .error-logo {
      height: 48px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeInUp 0.6s ease forwards;
    }

    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, var(--text-main) 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.1s forwards;
    }

    .error-title {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.2s forwards;
    }

    .error-description {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.3s forwards;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.4s forwards;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: var(--text-main);
      color: #fff;
      text-decoration: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      background: transparent;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 100px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      border: 1px solid var(--border-color);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: var(--text-main);
      transform: translateY(-2px);
    }

    .error-footer {
      position: absolute;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.6s forwards;
    }

    .error-footer a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
    }

    .error-footer a:hover {
      text-decoration: underline;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .floating-shape { display: none; }
      .error-container { padding: 2rem 2rem; }
    }
  </style>
</head>
<body>

  <!-- Background elements -->
  <div class="bg-grid"></div>
  <div class="floating-shape shape-1"></div>
  <div class="floating-shape shape-2"></div>
  <div class="floating-shape shape-3"></div>

  <!-- Content -->
  <div class="error-container">
    <img src="/img/logo.png" alt="3D Angels" class="error-logo">

    <div class="error-code">404</div>
    <h1 class="error-title">Página não encontrada</h1>
    <p class="error-description">
      A página que você procura não existe ou foi movida. 
      Mas não se preocupe — podemos te levar de volta ao caminho certo!
    </p>

    <div class="error-actions">
      <a href="/" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Ver Catálogo
      </a>
      <a href="/servicos" class="btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Nossos Serviços
      </a>
    </div>
  </div>

  <div class="error-footer">
    <p>Precisa de ajuda? <a href="https://wa.me/5519991946309" target="_blank" rel="noopener noreferrer">Fale conosco no WhatsApp</a></p>
  </div>

</body>
</html>
